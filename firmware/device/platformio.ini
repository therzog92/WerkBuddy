; WerkBuddy — Guition ESP32-4848S040 — shared sim UI + ESP-NOW
; Upload: pio run -t upload --upload-port COMx  (A=COM5, B=COM6)

[env:guition-4848s040]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.maximum_size = 16777216

upload_port = COM5
monitor_port = COM5
monitor_speed = 921600

build_unflags =
    -std=gnu++11
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DWP_DEVICE=1
    -DWP_HOR_RES=480
    -DWP_VER_RES=480
    -DLV_CONF_INCLUDE_SIMPLE
    ; Device drive USB shot/tap — OFF for shipping (header stubs = zero cost).
    ; Re-enable for agent glass QA: change to -DWERKPAGER_DEVICE_DRIVE=1
    -DWERKPAGER_DEVICE_DRIVE=0
    -std=gnu++17
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=32768
    -I include
    -I ../src
    -I .pio/libdeps/guition-4848s040/lvgl/src

; Thin-shell leftovers excluded — shared UI lives under firmware/src via extra script.
build_src_filter =
    +<*>
    -<shell.cpp>
    -<ttt_flow.cpp>
    -<ui_chrome.cpp>
    -<desk.cpp>
    -<espnow_link.cpp>
    -<protocol_pack.cpp>
    -<storage_nvs.cpp>

extra_scripts =
    pre:scripts/pio_shared_src.py

lib_ldf_mode = deep
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
    lvgl/lvgl@^9.2.0
